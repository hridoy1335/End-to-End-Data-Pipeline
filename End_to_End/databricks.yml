# This is a Databricks asset bundle definition for End_to_End.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: End_to_End
  uuid: 49e10291-ff80-47a5-85a4-62815987af76

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    presets:
      name_prefix: "dev_${workspace.current_user.short_name}"
    default: true
    workspace:
      host: https://dbc-f5635c5f-848f.cloud.databricks.com
    variables:
      catalog: dev
      schema: bronze
    permissions:
      - user_name: rkhridoyinfo@gmail.com
        level: CAN_MANAGE
  prod:
    mode: production
    presets:
      name_prefix: "prod_${workspace.current_user.short_name}"
    workspace:
      host: https://dbc-565e2d8b-e807.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rkhridoyinfo@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/hridoykinfo@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
      schema: bronze
    permissions:
      - user_name: hridoykinfo@gmail.com
        level: CAN_MANAGE
