# The main pipeline for End_to_End

resources:
  pipelines:
    end_to_end_etl:
      name: end_to_end_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/end_to_end_etl"

      libraries:
        - glob:
            include: ../src/end_to_end_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
